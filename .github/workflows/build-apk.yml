name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APKs (unsigned)
        run: |
          set -o pipefail
          gradle :app:assembleRelease :autotranslate:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors first (task lines would otherwise fill the annotation), then Gradle's summary.
          msg=$( { grep -E "^e: " build.log | head -40; grep -E -A3 "What went wrong" build.log | head -12; } | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      # Same debug key as earlier builds, so updates install over the existing app.
      - name: Debug-sign APK
        run: |
          curl -fsSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          mkdir unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned/EvenGlass.apk
          cp autotranslate/build/outputs/apk/release/autotranslate-release-unsigned.apk unsigned/EvenGlass-AutoTranslate.apk
          java -jar uber-apk-signer.jar -a unsigned -o signed
          ls -l signed

      - name: Rename APKs
        id: ver
        run: |
          cp signed/EvenGlass-aligned*.apk EvenGlass.apk
          cp signed/EvenGlass-AutoTranslate-aligned*.apk EvenGlass-AutoTranslate.apk
          ls -l EvenGlass.apk EvenGlass-AutoTranslate.apk
          echo "name=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "auto=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' autotranslate/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvenGlass-apk
          path: |
            EvenGlass.apk
            EvenGlass-AutoTranslate.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          name: EvenGlass ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body: |
            Debug-signed APKs built from ${{ github.sha }}.
            - EvenGlass.apk — camera translator ${{ steps.ver.outputs.name }}
            - EvenGlass-AutoTranslate.apk — EvenGlass 자동번역 (conversation translation + reply suggestions) ${{ steps.ver.outputs.auto }}
            Install on Galaxy: download the APK, then allow "install unknown apps".
          files: |
            EvenGlass.apk
            EvenGlass-AutoTranslate.apk
          make_latest: true
