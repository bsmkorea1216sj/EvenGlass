<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvenGlass 0.5.0 면접 코치</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#eef2ff;margin:0;padding:20px}main{max-width:720px;margin:auto}button,select,textarea,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #64748b}button{background:#2563eb;color:white;cursor:pointer;margin:4px}textarea{width:95%;min-height:75px;background:#fff;color:#111}article{background:#1e293b;padding:18px;border-radius:14px;margin-top:16px}.muted{color:#cbd5e1}#answer{white-space:pre-wrap;line-height:1.7}</style></head><body><main><h1>EvenGlass 0.5.0</h1><p>AI 면접 코치 · 갤럭시 / PC</p><label for="school">면접 데이터</label><select id="school"><option>경복대학교</option></select><p><label for="file">다른 대학 JSON 불러오기</label> <input id="file" type="file" accept=".json,application/json"></p><textarea id="question" placeholder="예: 우리 대학에 어떻게 기여하시겠습니까?"></textarea><p><button id="search">답변 찾기</button><button id="mic">🎙 음성 질문</button></p><p class="muted" id="status">질문을 입력하거나 마이크를 누르세요.</p><article><h2 id="title">준비된 질문을 선택하세요</h2><p id="keywords"></p><p id="answer"></p><button id="again">답변 다시 보기</button></article><h3>질문 직접 선택</h3><div id="list"></div><p class="muted">마이크는 HTTPS 및 지원 브라우저에서만 작동합니다. 실제 면접에서는 AI 사용 허용 여부와 음성 수집 동의 조건을 확인하세요.</p></main><script>
let data={school:"경복대학교",questions:[
{id:"Q001",question:"자기소개를 해주세요",keywords:["AI·클라우드","실무 교육","산학협력"],answer:"저는 AI와 클라우드, 데이터 분석을 중심으로 교육과 현장 프로젝트를 연결해 온 교육자입니다. 학생들이 실무 역량을 포트폴리오로 증명하도록 돕겠습니다."},
{id:"Q002",question:"우리 대학에 어떻게 기여하시겠습니까?",keywords:["에이전틱 AI","학과 간 융합","AID·RISE","산학협력"],answer:"에이전틱 AI와 클라우드 실무교육을 강화하고, 간호보건·디자인 계열과 융합 프로젝트를 추진하겠습니다. AID·RISE 사업과 연계해 산학협력과 학생 취업 경쟁력을 높이겠습니다."},
{id:"Q003",question:"학생 취업률을 어떻게 높이시겠습니까?",keywords:["기업 연계","자격증","포트폴리오","현장 프로젝트"],answer:"기업 수요를 반영한 프로젝트형 수업을 운영하겠습니다. 클라우드 자격증, 실전 포트폴리오, 공모전 및 산학 프로젝트를 취업 준비와 직접 연결하겠습니다."},
{id:"Q004",question:"AID와 RISE 사업에 어떻게 기여하시겠습니까?",keywords:["지역 산업","AI 전환","재직자 교육","실증"],answer:"지역 기업의 AI 전환 수요를 발굴하고 학생과 기업이 함께하는 실증 프로젝트를 운영하겠습니다. 재직자 교육과 지역 협력을 통해 교육 성과가 산업 현장으로 이어지도록 하겠습니다."},
{id:"Q005",question:"학과 간 융합 교육을 어떻게 추진하시겠습니까?",keywords:["간호보건","디자인","AI","융합 프로젝트"],answer:"간호보건 분야의 데이터 활용과 디자인 분야의 AI 콘텐츠 제작을 소프트웨어 교육과 연결하겠습니다. 학과 공동 프로젝트로 학생들이 협업과 문제 해결 역량을 쌓도록 하겠습니다."},
{id:"Q006",question:"학생 모집과 학과 발전 전략은 무엇입니까?",keywords:["AI 특성화","산학 네트워크","학생 모집","성과 홍보"],answer:"에이전틱 AI와 클라우드 실무교육을 학과의 특성화 방향으로 제시하겠습니다. 산학협력, 취업 성과, 학생 프로젝트를 체계적으로 홍보해 학과 경쟁력과 모집 기반을 강화하겠습니다."}
]};
const $=id=>document.getElementById(id);function norm(s){return (s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"")}function grams(s){s=norm(s);let a=new Set();for(let i=0;i<s.length-1;i++)a.add(s.slice(i,i+2));return a}function score(a,b){let x=grams(a),y=grams(b);if(!x.size||!y.size)return 0;let n=0;x.forEach(v=>{if(y.has(v))n++});return 2*n/(x.size+y.size)}function show(q){$("title").textContent=q.question;$("keywords").textContent=q.keywords.join(" · ");$("answer").textContent=q.answer;$("status").textContent="준비된 답변을 표시했습니다."}function render(){$("school").innerHTML="";let o=document.createElement("option");o.textContent=data.school;$("school").append(o);$("list").innerHTML="";data.questions.forEach(q=>{let b=document.createElement("button");b.textContent=q.question;b.onclick=()=>show(q);$("list").append(b)})}function search(){let v=$("question").value.trim();if(!v){$("status").textContent="질문을 입력하세요.";return}let ranked=data.questions.map(q=>({q,s:Math.max(score(v,q.question),...((q.aliases||[]).map(a=>score(v,a))))})).sort((a,b)=>b.s-a.s);if(ranked[0]?.s>=.22)show(ranked[0].q);else{$("title").textContent="일치하는 질문 없음";$("keywords").textContent="";$("answer").textContent="준비된 답변이 없습니다. 질문 목록에서 직접 선택해 주세요.";$("status").textContent="검색 결과 없음"}}$("search").onclick=search;$("again").onclick=()=>{$("answer").scrollIntoView({behavior:"smooth"})};$("file").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(typeof d.school!=="string"||!Array.isArray(d.questions)||!d.questions.every(q=>typeof q.question==="string"&&typeof q.answer==="string"&&Array.isArray(q.keywords)))throw Error("JSON 형식 오류");data=d;render();$("status").textContent=d.school+" 데이터 불러오기 완료"}catch(err){$("status").textContent="파일 오류: "+err.message}};$("mic").onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$("status").textContent="이 브라우저는 음성 인식을 지원하지 않습니다.";return}let r=new R();r.lang="ko-KR";r.interimResults=false;r.onresult=e=>{$("question").value=e.results[0][0].transcript;search()};r.onerror=e=>$("status").textContent="음성 인식 오류: "+e.error;r.start();$("status").textContent="질문을 말씀해 주세요."};render();
</script></body></html>
