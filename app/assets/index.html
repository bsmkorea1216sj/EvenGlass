<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>EvenGlass</title>
<style>
:root{--bg:#101827;--card:#17243a;--line:#50637f;--txt:#eef4ff;--mut:#a5b7cf;--g:#70efb3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:14px 14px 40px}
h1{font-size:21px;margin:4px 0 10px}h1 span{color:var(--mut);font-size:14px;font-weight:400}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1}
button,select{background:#273953;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
button:active{background:#41638c}button.on{background:#2f6b55;border-color:var(--g)}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:52vh;width:100%}
video,#still{width:100%;height:100%;object-fit:cover;display:block}
#still{position:absolute;inset:0;display:none}
.live{position:absolute;top:8px;left:8px;background:#0009;color:var(--g);font-size:12px;padding:4px 8px;border-radius:8px}
.live.off{color:#ffb4b4}
.over{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000c 30%);color:#fff;font-size:19px;line-height:1.5;padding:26px 12px 10px;white-space:pre-wrap;max-height:60%;overflow:auto}
.over:empty{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar button{flex:1;min-width:100px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;white-space:pre-wrap;line-height:1.65}
.card h3{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:500}
.glass{background:#020a0a;color:var(--g);font-size:22px;line-height:1.6;max-width:430px}
.mut{color:var(--mut);font-size:13px}
.hide{display:none!important}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
select{width:100%}
</style></head><body><main>
<h1>EvenGlass <span>실시간 일→한 번역 · 프롬프터</span></h1>
<nav>
<button data-tab="tr" class="on">실시간 번역</button>
<button data-tab="pr">프롬프터</button>
<button data-tab="set">설정</button>
</nav>

<section id="tab-tr">
  <div class="cam">
    <video id="video" playsinline muted autoplay></video><canvas id="still"></canvas>
    <div id="live" class="live off">준비 중</div>
    <div id="over" class="over"></div>
  </div>
  <div class="bar">
    <button id="pause">⏸ 일시정지</button>
    <button id="flip">카메라 전환</button>
    <button id="pick">🖼 사진 선택</button>
    <button id="g2">G2 미리보기</button>
  </div>
  <input id="file" type="file" accept="image/*" class="hide">
  <p id="status" class="mut"></p>
  <div class="card" id="koBox"><h3>한국어 번역</h3><div id="ko">카메라를 일본어 글자에 비추면 자동으로 번역합니다.</div></div>
  <div class="card"><h3>인식한 일본어</h3><div id="orig"></div></div>
</section>

<section id="tab-set" class="hide">
  <div class="card" style="white-space:normal">
  <label>인식 간격</label>
  <select id="interval">
    <option value="800">빠름 (배터리·데이터 더 씀)</option>
    <option value="1500" selected>보통</option>
    <option value="3000">절약</option>
  </select>
  <label>글자 방향</label>
  <select id="lang">
    <option value="jpn">가로쓰기</option>
    <option value="jpn_vert">세로쓰기 (책·간판)</option>
  </select>
  <div class="bar"><button id="saveSet">저장</button></div>
  <p class="mut">글자 인식은 휴대폰 안에서 처리하고(Tesseract OCR), 번역은 MyMemory 무료 번역을 씁니다. API 키가 필요 없습니다. 처음 실행할 때 일본어 인식 데이터(수 MB)를 내려받고, 무료 번역은 하루 사용량 제한이 있어 화면의 글자가 바뀔 때만 번역합니다.</p>
  <p class="mut" id="ver">EvenGlass 0.2.0 · G2 안경 실제 연동은 아직 미지원(미리보기만)</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={get iv(){return +(localStorage.getItem('eg-interval')||1500)},get lang(){return localStorage.getItem('eg-lang')||'jpn'}};
let stream=null,facing='environment',paused=false,busy=false,worker=null,workerLang='',lastOrig='',timer=null;
const cache=new Map();
const JP=/[぀-ヿ㐀-鿿ｦ-ﾟ]/g;

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab;
  if(t==='pr'){location.href='prompter.html';return}
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['tr','set'].forEach(n=>$('tab-'+n).classList.toggle('hide',n!==t));
});

const setStatus=t=>$('status').textContent=t||'';
const live=(t,on)=>{$('live').textContent=t;$('live').classList.toggle('off',!on)};

// ---------- camera ----------
let camTries=0;
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;live('카메라 여는 중',false);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    live('카메라 없음',false);setStatus('실시간 카메라를 쓸 수 없습니다. [사진 선택]을 쓰세요.');return;
  }
  const tries=[
    {video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1440}},audio:false},
    {video:{facingMode:{ideal:facing}},audio:false},
    {video:true,audio:false}
  ];
  let err=null;
  for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e}}
  if(!stream){
    live('카메라 오류',false);
    setStatus('카메라를 열 수 없습니다 ('+(err&&err.name)+': '+(err&&err.message)+'). 휴대폰 설정 > 애플리케이션 > EvenGlass > 권한에서 카메라를 허용하거나 [사진 선택]을 쓰세요.');
    if(++camTries<5)setTimeout(startCam,3000);
    return;
  }
  camTries=0;
  const v=$('video');v.srcObject=stream;
  try{await v.play()}catch(e){}
  setStatus('');schedule(300);
}
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};

// ---------- OCR ----------
async function getWorker(){
  if(!window.Tesseract)throw new Error('글자 인식 라이브러리를 불러오지 못했습니다(인터넷 연결 확인).');
  if(worker&&workerLang===S.lang)return worker;
  if(worker){await worker.terminate();worker=null}
  live('인식 데이터 준비 중',false);setStatus('일본어 인식 데이터를 내려받는 중… (처음 한 번만 오래 걸립니다)');
  worker=await Tesseract.createWorker(S.lang);workerLang=S.lang;setStatus('');
  return worker;
}
function frame(src,w,h){
  const max=1280,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}
async function ocr(canvas){
  const w=await getWorker();
  const {data}=await w.recognize(canvas);
  const lines=data.text.split('\n').map(l=>l.replace(/[ \t　]+/g,'').trim())
    .filter(l=>(l.match(JP)||[]).length>=2);
  return lines.join('\n');
}

// ---------- translate (MyMemory, no key) ----------
async function translate(text){
  if(cache.has(text))return cache.get(text);
  const lines=text.split('\n'),chunks=[];let cur='';
  for(const l of lines){if((cur+l).length>450){if(cur)chunks.push(cur);cur=l}else cur=cur?cur+'\n'+l:l}
  if(cur)chunks.push(cur);
  const out=[];
  for(const ch of chunks){
    const r=await fetch('https://api.mymemory.translated.net/get?langpair=ja|ko&q='+encodeURIComponent(ch));
    const j=await r.json();
    const t=j.responseData&&j.responseData.translatedText||'';
    if(j.responseStatus==429||/MYMEMORY WARNING/i.test(t))throw new Error('오늘 무료 번역 사용량을 다 썼습니다. 내일 다시 시도하세요.');
    out.push(t);
  }
  const res=out.join('\n');cache.set(text,res);
  if(cache.size>200)cache.delete(cache.keys().next().value);
  return res;
}

// similarity of two strings by shared character bigrams
function similar(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  const bg=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);m.set(k,(m.get(k)||0)+1)}return m};
  const A=bg(a),B=bg(b);let n=0;
  for(const [k,c] of A)n+=Math.min(c,B.get(k)||0);
  return 2*n/Math.max(1,(a.length-1)+(b.length-1));
}

async function process(canvas){
  const text=await ocr(canvas);
  if(!text){live('일본어 찾는 중',true);return}
  if(similar(text,lastOrig)>0.8){live('실시간',true);return}
  lastOrig=text;$('orig').textContent=text;
  live('번역 중…',true);
  const ko=await translate(text);
  $('ko').textContent=ko;$('over').textContent=ko;live('실시간',true);setStatus('');
}

// ---------- live loop ----------
function schedule(ms){clearTimeout(timer);timer=setTimeout(tick,ms)}
async function tick(){
  if(paused||busy||document.hidden){schedule(S.iv);return}
  const v=$('video');
  if(!v.videoWidth){schedule(500);return}
  busy=true;
  try{await process(frame(v,v.videoWidth,v.videoHeight))}
  catch(e){live('오류',false);setStatus('오류: '+e.message)}
  busy=false;schedule(S.iv);
}
function setPaused(p){
  paused=p;$('pause').textContent=p?'▶ 계속':'⏸ 일시정지';
  if(p)live('일시정지',false);else{$('still').style.display='none';lastOrig='';live('실시간',true);schedule(100)}
}
$('pause').onclick=()=>setPaused(!paused);

// ---------- photo ----------
$('pick').onclick=()=>$('file').click();
$('file').onchange=()=>{
  const f=$('file').files[0];if(!f)return;
  const img=new Image();
  img.onload=async()=>{
    URL.revokeObjectURL(img.src);setPaused(true);
    const c=frame(img,img.width,img.height),s=$('still');
    s.width=c.width;s.height=c.height;s.getContext('2d').drawImage(c,0,0);s.style.display='block';
    busy=true;lastOrig='';
    try{live('사진 번역 중',true);await process(c);live('사진',false)}
    catch(e){setStatus('오류: '+e.message)}
    busy=false;
  };
  img.onerror=()=>setStatus('이미지를 열 수 없습니다.');
  img.src=URL.createObjectURL(f);$('file').value='';
};

$('g2').onclick=()=>{const on=$('koBox').classList.toggle('glass');$('g2').textContent=on?'일반 화면':'G2 미리보기'};

// ---------- settings ----------
$('interval').value=String(S.iv);$('lang').value=S.lang;
$('saveSet').onclick=()=>{
  localStorage.setItem('eg-interval',$('interval').value);localStorage.setItem('eg-lang',$('lang').value);
  $('ver').textContent='저장했습니다.';lastOrig='';
  setTimeout(()=>$('ver').textContent='EvenGlass 0.2.0 · G2 안경 실제 연동은 아직 미지원(미리보기만)',2000);
};

startCam();
</script></main></body></html>
