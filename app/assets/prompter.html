<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>EvenGlass 발표 프롬프터</title>
<style>body{margin:0;background:#101827;color:#eef4ff;font:17px system-ui,sans-serif}main{max-width:800px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:22px}button,select{background:#273953;color:white;border:1px solid #50637f;border-radius:12px;padding:12px;font-size:16px}button:active{background:#41638c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.note{font-size:var(--size,23px);line-height:1.8;white-space:pre-wrap;background:#17243a;border-radius:16px;padding:20px;min-height:45vh}.muted{color:#a5b7cf}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}input[type=range]{width:110px}.glass{max-width:430px}.glass .note{color:#70efb3;background:#020a0a;max-height:46vh;overflow:auto}textarea{width:100%;min-height:160px;box-sizing:border-box;background:#17243a;color:white;border:1px solid #50637f;border-radius:10px;padding:12px;font:inherit}small{color:#a5b7cf}</style></head><body><main><header><button onclick="location.href='index.html'">← 메인</button><h1>EvenGlass <span class="muted">Prototype</span></h1><button id="mode">G2 화면 미리보기</button></header><p class="muted">13-1. AWS 요금 체계의 이해 · 갤럭시 웹앱 테스트</p><div class="row"><strong id="title"></strong><span id="count"></span></div><div class="toolbar"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button><button id="minus">글자 −</button><button id="plus">글자 +</button><button id="auto">자동 스크롤 시작</button></div><section class="note" id="note" tabindex="0"></section><details><summary>현재 대본 수정</summary><textarea id="editor"></textarea><button id="save">수정 저장</button></details><p><small>현재는 스마트폰용 웹 프롬프터입니다. 실제 G2 연결·R1 링·PPT 실시간 동기화는 지원하지 않습니다. 샘플 3장만 수록했습니다. 화면을 좌우로 밀어 슬라이드를 바꿀 수 있습니다.</small></p></main>
<script>
const initial=[
{title:"1. 강의 소개",note:"안녕하세요, 여러분! 오늘부터 13주차 수업을 시작하겠습니다. 이번 주는 클라우드 환경에서 매우 중요한 주제인 '클라우드 비용 최적화 및 요금 분석'에 대해 학습하게 됩니다.\n\n클라우드를 도입하면서 많은 기업들이 직면하는 가장 큰 도전 과제 중 하나가 바로 비용 관리입니다. 기존의 온프레미스 환경과는 완전히 다른 비용 구조를 가지고 있기 때문에, 이를 제대로 이해하지 못하면 예상보다 훨씬 많은 비용이 발생할 수 있습니다."},
{title:"2. 학습 목표 및 진행 순서",note:"오늘 수업의 진행 순서입니다.\n\n먼저 '클라우드 소비 모델'에서 기존 IT 환경과 클라우드 환경의 비용 구조 차이를 살펴보겠습니다. 특히 자본 지출(CapEx)에서 운영 지출(OpEx)로의 전환이 가져오는 재무적 영향과 의사결정 방식의 변화에 중점을 두겠습니다.\n\n다음으로 'AWS 요금 모델 이해'에서 AWS의 핵심 요금 책정 원칙과 다양한 요금 모델을 학습하겠습니다.\n\n마지막으로 '주요 AWS 서비스별 요금 구조'에서 EC2, S3, RDS, DynamoDB 등 핵심 서비스들의 과금 방식을 알아보겠습니다."},
{title:"3. 클라우드 소비 모델",note:"첫 번째 섹션인 '클라우드 소비 모델'을 시작하겠습니다.\n\n클라우드 비용을 이해하기 위해서는 먼저 클라우드가 기존 IT 환경과 어떻게 다른 소비 모델을 가지고 있는지 이해해야 합니다.\n\n온프레미스 환경에서는 하드웨어와 소프트웨어에 대한 대규모 선투자가 필요하고, 실제 사용량과 관계없이 최대 용량에 맞춰 자원을 구매해야 했습니다. 반면 클라우드 환경에서는 필요한 만큼만 자원을 사용하고 그에 따른 비용을 지불하는 유틸리티 모델이 적용됩니다."}
];
let slides;try{slides=JSON.parse(localStorage.getItem('evenglass-notes'))||initial}catch{slides=initial}
let i=0,size=23,timer=null,glass=false;const el=id=>document.getElementById(id),note=el('note');
function render(){el('title').textContent=slides[i].title;el('count').textContent=(i+1)+' / '+slides.length;note.textContent=slides[i].note;el('editor').value=slides[i].note;note.scrollTop=0}
function move(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);
el('minus').onclick=()=>{size=Math.max(15,size-2);note.style.setProperty('--size',size+'px')};
el('plus').onclick=()=>{size=Math.min(40,size+2);note.style.setProperty('--size',size+'px')};
el('mode').onclick=()=>{glass=!glass;document.querySelector('main').classList.toggle('glass',glass);el('mode').textContent=glass?'일반 화면':'G2 화면 미리보기'};
el('save').onclick=()=>{slides[i].note=el('editor').value;localStorage.setItem('evenglass-notes',JSON.stringify(slides));render()};
el('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;el('auto').textContent='자동 스크롤 시작'}else{timer=setInterval(()=>{note.scrollTop+=1},80);el('auto').textContent='자동 스크롤 중지'}};
let x=0;note.addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});note.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>80)move(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
</script></body></html>
