name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (unsigned)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not|Caused by|^> " build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      # Same debug key as earlier builds, so updates install over the existing app.
      - name: Debug-sign APK
        run: |
          curl -fsSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar -a app/build/outputs/apk/release/app-release-unsigned.apk -o signed

      - name: Rename APK
        id: ver
        run: |
          cp signed/*.apk EvenGlass.apk
          ls -l EvenGlass.apk
          echo "name=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvenGlass-apk
          path: EvenGlass.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          name: EvenGlass ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body: |
            Debug-signed APK built from ${{ github.sha }}.
            Install on Galaxy: download EvenGlass.apk, then allow "install unknown apps".
          files: EvenGlass.apk
          make_latest: true
