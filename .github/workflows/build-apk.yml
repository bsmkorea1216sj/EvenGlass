name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool and uber-apk-signer
        run: |
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fsSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          ls -l *.jar

      - name: Build unsigned APK
        run: java -jar apktool.jar b app -o unsigned.apk

      - name: Debug-sign APK
        run: java -jar uber-apk-signer.jar -a unsigned.apk -o signed

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvenGlass-apk
          path: signed/*.apk
          if-no-files-found: error
